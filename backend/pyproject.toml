[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::sqlalchemy.exc.SAWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
